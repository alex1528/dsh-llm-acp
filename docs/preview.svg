<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#ecfeff"/>
    </linearGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="640" height="300" rx="18" fill="url(#bg)"/>

  <!-- Left: local ACP CLI agents -->
  <g>
    <rect x="34" y="58" width="150" height="184" rx="12" fill="url(#card)" stroke="#c7d2fe"/>
    <rect x="46" y="68" width="126" height="22" rx="6" fill="#e0e7ff"/>
    <rect x="56" y="74" width="16" height="10" rx="3" fill="#6366f1"/>
    <g fill="#475569">
      <circle cx="58" cy="112" r="5" fill="#10b981"/><rect x="70" y="108" width="80" height="8" rx="4"/>
      <circle cx="58" cy="142" r="5" fill="#0ea5e9"/><rect x="70" y="138" width="66" height="8" rx="4"/>
      <circle cx="58" cy="172" r="5" fill="#f59e0b"/><rect x="70" y="168" width="74" height="8" rx="4"/>
      <circle cx="58" cy="202" r="5" fill="#ec4899"/><rect x="70" y="198" width="58" height="8" rx="4"/>
    </g>
  </g>

  <!-- Middle: the plugin hub -->
  <g>
    <rect x="248" y="86" width="136" height="128" rx="18" fill="url(#hub)"/>
    <rect x="272" y="108" width="88" height="40" rx="7" fill="none" stroke="#ffffff" stroke-width="4"/>
    <path d="M286 120l8 8-8 8" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M302 136h44" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <path d="M282 166h68" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <circle cx="316" cy="198" r="5" fill="#a5f3fc"/>
  </g>

  <!-- Arrows CLI -> hub -> DSH -->
  <g stroke="#6366f1" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M184 128c22 0 34 12 64 22" marker-end="url(#a)"/>
    <path d="M184 170c22 0 34-6 64-10" marker-end="url(#a)"/>
    <path d="M384 150c26 0 38-22 66-22" marker-end="url(#a)"/>
  </g>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1 1l6 3-6 3z" fill="#6366f1"/>
    </marker>
  </defs>

  <!-- Right: model routes + console -->
  <g>
    <rect x="452" y="70" width="154" height="92" rx="12" fill="url(#card)" stroke="#a5b4fc"/>
    <circle cx="470" cy="92" r="5" fill="#8b5cf6"/><rect x="482" y="88" width="100" height="8" rx="4" fill="#8b5cf6" opacity="0.7"/>
    <circle cx="470" cy="116" r="5" fill="#0ea5e9"/><rect x="482" y="112" width="84" height="8" rx="4" fill="#0ea5e9" opacity="0.7"/>
    <circle cx="470" cy="140" r="5" fill="#10b981"/><rect x="482" y="136" width="94" height="8" rx="4" fill="#10b981" opacity="0.7"/>
    <rect x="452" y="176" width="154" height="66" rx="12" fill="url(#card)" stroke="#99f6e4"/>
    <path d="M466 214l10-14 10 9 12-18 10 10 12-8" fill="none" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="588" cy="195" r="4" fill="#10b981"/>
    <circle cx="588" cy="223" r="4" fill="#f59e0b"/>
  </g>
</svg>
